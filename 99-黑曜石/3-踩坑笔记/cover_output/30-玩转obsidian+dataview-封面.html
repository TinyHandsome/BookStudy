<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>玩转 Obsidian + Dataview · 公众号封面</title>
<style>
  html, body { margin: 0; padding: 0; background: #05070f; overflow: hidden; }
  .cover { display: block; width: 1200px; height: 511px; }
  text { font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Source Han Sans SC", "Noto Sans SC", sans-serif; }
  .mono { font-family: "Consolas", "JetBrains Mono", "SF Mono", monospace; }
</style>
</head>
<body>
<svg class="cover" viewBox="0 0 1200 511" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景渐变：深蓝 → 暗紫 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1030"/>
      <stop offset="0.5" stop-color="#0A0E27"/>
      <stop offset="1" stop-color="#1A0B2E"/>
    </linearGradient>

    <!-- 主体光晕 -->
    <radialGradient id="halo" cx="0.73" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.32"/>
      <stop offset="0.45" stop-color="#7C3AED" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <!-- 黑曜石水晶渐变 -->
    <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12204a"/>
      <stop offset="0.5" stop-color="#0a0e27"/>
      <stop offset="1" stop-color="#2c1152"/>
    </linearGradient>

    <!-- 主标题第二行：青 → 紫 -->
    <linearGradient id="hero2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>

    <!-- 网格 -->
    <pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M45 0 H0 V45" fill="none" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.05"/>
    </pattern>
    <radialGradient id="gridFade" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1200" height="511" fill="url(#gridFade)"/></mask>

    <!-- 暗角 -->
    <radialGradient id="vign" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#05070f" stop-opacity="0"/>
      <stop offset="1" stop-color="#05070f" stop-opacity="0.55"/>
    </radialGradient>

    <!-- 霓虹发光 -->
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="titleGlow" x="-30%" y="-60%" width="160%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#22D3EE" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 1 背景 -->
  <rect width="1200" height="511" fill="url(#bg)"/>
  <rect width="1200" height="511" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1200" height="511" fill="url(#halo)"/>

  <!-- 2 背景漂浮代码（淡） -->
  <g class="mono" fill="#22D3EE" opacity="0.10" font-size="15">
    <text x="560" y="72">SELECT link, tags FROM notes</text>
    <text x="588" y="468">dv.pages("日记").where(p =&gt; p.file.name)</text>
    <text x="948" y="472">## 玩转 obsidian+dataview</text>
    <text x="1010" y="96">WHERE year = 2025</text>
  </g>

  <!-- 3 知识图谱（水晶背后） -->
  <g stroke="#22D3EE" stroke-opacity="0.28" stroke-width="1.2">
    <line x1="980" y1="90" x2="1150" y2="90"/>
    <line x1="1150" y1="90" x2="1060" y2="150"/>
    <line x1="1060" y1="150" x2="1140" y2="240"/>
    <line x1="1140" y1="240" x2="1090" y2="330"/>
    <line x1="1090" y1="330" x2="1160" y2="400"/>
    <line x1="1140" y1="240" x2="1000" y2="440"/>
    <line x1="1090" y1="330" x2="1000" y2="440"/>
    <line x1="980" y1="90" x2="700" y2="120"/>
    <line x1="700" y1="120" x2="640" y2="200"/>
    <line x1="640" y1="200" x2="620" y2="320"/>
    <line x1="620" y1="320" x2="700" y2="420"/>
    <line x1="700" y1="120" x2="880" y2="60"/>
    <line x1="700" y1="420" x2="1000" y2="440"/>
  </g>
  <g filter="url(#neon)">
    <circle cx="1150" cy="90" r="5" fill="#22D3EE"/>
    <circle cx="1060" cy="150" r="4" fill="#A855F7"/>
    <circle cx="1140" cy="240" r="6" fill="#22D3EE"/>
    <circle cx="1090" cy="330" r="4" fill="#3B82F6"/>
    <circle cx="1160" cy="400" r="5" fill="#A855F7"/>
    <circle cx="1000" cy="440" r="5" fill="#22D3EE"/>
    <circle cx="980" cy="90" r="4" fill="#22D3EE"/>
    <circle cx="700" cy="120" r="5" fill="#A855F7"/>
    <circle cx="640" cy="200" r="4" fill="#22D3EE"/>
    <circle cx="620" cy="320" r="5" fill="#3B82F6"/>
    <circle cx="700" cy="420" r="4" fill="#A855F7"/>
    <circle cx="880" cy="60" r="3" fill="#22D3EE"/>
    <circle cx="1120" cy="170" r="3" fill="#3B82F6"/>
  </g>

  <!-- 4 黑曜石水晶 -->
  <g>
    <polygon points="880,105 1010,190 1010,330 880,405 750,330 750,190"
             fill="url(#crystal)" fill-opacity="0.92"
             stroke="#22D3EE" stroke-opacity="0.5" stroke-width="1.5"/>
    <g stroke="#22D3EE" stroke-opacity="0.12" stroke-width="1">
      <line x1="880" y1="105" x2="880" y2="405"/>
      <line x1="750" y1="190" x2="1010" y2="330"/>
      <line x1="1010" y1="190" x2="750" y2="330"/>
    </g>
    <polygon points="880,105 750,190 880,255" fill="#22D3EE" fill-opacity="0.07"/>
  </g>

  <!-- 5 全息数据表（水晶中浮现） -->
  <g>
    <rect x="786" y="180" width="228" height="162" rx="10" fill="#22D3EE" opacity="0.25" filter="url(#soft)"/>
    <rect x="792" y="186" width="216" height="150" rx="7" fill="#0a0e27" fill-opacity="0.55"
          stroke="#22D3EE" stroke-opacity="0.8" stroke-width="1.5"/>
    <!-- 表头底 -->
    <rect x="792" y="186" width="216" height="30" rx="7" fill="#22D3EE" fill-opacity="0.12"/>
    <!-- 网格线 -->
    <g stroke="#22D3EE" stroke-opacity="0.22" stroke-width="1">
      <line x1="846" y1="186" x2="846" y2="336"/>
      <line x1="900" y1="186" x2="900" y2="336"/>
      <line x1="954" y1="186" x2="954" y2="336"/>
      <line x1="792" y1="216" x2="1008" y2="216"/>
      <line x1="792" y1="246" x2="1008" y2="246"/>
      <line x1="792" y1="276" x2="1008" y2="276"/>
      <line x1="792" y1="306" x2="1008" y2="306"/>
    </g>
    <!-- 表头内容条 -->
    <g fill="#7DF9FF" fill-opacity="0.65">
      <rect x="798" y="197" width="40" height="6" rx="3"/>
      <rect x="852" y="197" width="40" height="6" rx="3"/>
      <rect x="906" y="197" width="40" height="6" rx="3"/>
    </g>
    <!-- 单元格内容条 -->
    <g>
      <rect x="798" y="228" width="42" height="8" rx="4" fill="#22D3EE" fill-opacity="0.85"/>
      <rect x="852" y="228" width="42" height="8" rx="4" fill="#A855F7" fill-opacity="0.8"/>
      <rect x="906" y="228" width="42" height="8" rx="4" fill="#3B82F6" fill-opacity="0.7"/>
      <rect x="960" y="228" width="38" height="8" rx="4" fill="#22D3EE" fill-opacity="0.45"/>

      <rect x="798" y="258" width="42" height="8" rx="4" fill="#22D3EE" fill-opacity="0.8"/>
      <rect x="852" y="258" width="30" height="8" rx="4" fill="#A855F7" fill-opacity="0.7"/>
      <rect x="906" y="256" width="44" height="12" rx="6" fill="#A855F7" fill-opacity="0.2" stroke="#A855F7" stroke-opacity="0.8" stroke-width="1"/>
      <rect x="960" y="258" width="34" height="8" rx="4" fill="#3B82F6" fill-opacity="0.5"/>

      <rect x="798" y="288" width="42" height="8" rx="4" fill="#22D3EE" fill-opacity="0.7"/>
      <rect x="852" y="288" width="40" height="8" rx="4" fill="#A855F7" fill-opacity="0.6"/>
      <rect x="906" y="288" width="28" height="8" rx="4" fill="#3B82F6" fill-opacity="0.5"/>
      <rect x="960" y="288" width="30" height="8" rx="4" fill="#22D3EE" fill-opacity="0.4"/>

      <rect x="798" y="318" width="36" height="8" rx="4" fill="#22D3EE" fill-opacity="0.6"/>
      <rect x="852" y="318" width="26" height="8" rx="4" fill="#A855F7" fill-opacity="0.5"/>
      <rect x="906" y="318" width="30" height="8" rx="4" fill="#3B82F6" fill-opacity="0.4"/>
    </g>
  </g>

  <!-- 6 粒子 -->
  <g filter="url(#neon)">
    <circle cx="300" cy="90" r="2" fill="#22D3EE" opacity="0.7"/>
    <circle cx="520" cy="420" r="2.5" fill="#A855F7" opacity="0.6"/>
    <circle cx="180" cy="300" r="1.8" fill="#22D3EE" opacity="0.6"/>
    <circle cx="620" cy="150" r="2" fill="#A855F7" opacity="0.7"/>
    <circle cx="960" cy="470" r="2.2" fill="#A855F7" opacity="0.6"/>
    <circle cx="420" cy="250" r="1.5" fill="#22D3EE" opacity="0.6"/>
    <circle cx="760" cy="60" r="2" fill="#A855F7" opacity="0.7"/>
    <circle cx="1100" cy="470" r="1.8" fill="#22D3EE" opacity="0.55"/>
    <circle cx="260" cy="440" r="2" fill="#A855F7" opacity="0.55"/>
    <circle cx="560" cy="60" r="1.6" fill="#22D3EE" opacity="0.6"/>
  </g>

  <!-- 7 暗角 -->
  <rect width="1200" height="511" fill="url(#vign)"/>

  <!-- 8 科技角标框 -->
  <g stroke="#22D3EE" stroke-opacity="0.5" stroke-width="2" fill="none">
    <path d="M20 40 V20 H40"/>
    <path d="M1160 20 H1180 V40"/>
    <path d="M1180 471 V491 H1160"/>
    <path d="M40 491 H20 V471"/>
  </g>

  <!-- 9 文字区（左侧留白） -->
  <g>
    <text x="70" y="140" font-size="20" font-weight="600" letter-spacing="4" fill="#22D3EE" fill-opacity="0.9">踩坑笔记 · 让笔记可查询</text>

    <g filter="url(#titleGlow)">
      <text x="66" y="216" font-size="66" font-weight="800" fill="#FFFFFF">玩转 Obsidian</text>
      <text x="66" y="288" font-size="66" font-weight="800" fill="url(#hero2)">+ Dataview</text>
    </g>

    <text x="70" y="336" font-size="22" font-weight="400" letter-spacing="1" fill="#A6B0D8">像查 SQL 一样，查询你的笔记</text>

    <!-- 标签 chips -->
    <g font-size="16" font-weight="600">
      <rect x="70" y="428" width="118" height="30" rx="15" fill="#22D3EE" fill-opacity="0.08" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1"/>
      <text x="129" y="448" text-anchor="middle" fill="#7DF9FF">#obsidian</text>
      <rect x="198" y="428" width="128" height="30" rx="15" fill="#A855F7" fill-opacity="0.10" stroke="#A855F7" stroke-opacity="0.55" stroke-width="1"/>
      <text x="262" y="448" text-anchor="middle" fill="#D8B4FE">#dataview</text>
      <text x="340" y="448" font-weight="400" fill="#7A83A8" letter-spacing="0.5">@李英俊小朋友</text>
    </g>
  </g>
</svg>
</body>
</html>
